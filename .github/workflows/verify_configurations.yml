name: Verify NixOS Configurations
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  generate_matrix:
    name: Generate configuration matrix
    runs-on: ubuntu-latest
    outputs:
      nixos_configurations:
        ${{ steps.get_configurations.outputs.nixos_configurations }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Get NixOS configurations
        id: get_configurations
        run: |
          nix flake show --json > flake.json
          cfgs="$(jq -c '.nixosConfigurations | keys' < flake.json)"
          echo "nixos_configurations=$cfgs" >> $GITHUB_OUTPUT

  check_flake:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: enabled

      - name: Check flake
        run: nix flake check --keep-going

  build_flake:
    name: Build flake
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [generate_matrix]
    strategy:
      fail-fast: false
      matrix:
        nixos_configurations:
          ${{ fromJson(needs.generate_matrix.outputs.nixos_configurations) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@v10

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: enabled

      - name: Build configuration
        run: nix build .#nixosConfigurations.${{ matrix.nixos_configurations }}.config.system.build.toplevel --no-link

  build_agg:
    name: All flake builds
    runs-on: ubuntu-latest
    needs: build_flake
    steps:
      - name: Aggreagate
        run: exit 0

  build_flake_results:
    name: Build flake all results
    runs-on: ubuntu-latest
    needs: [build_flake, build_agg]
    if: ${{ !cancelled() }}
    steps:
      - name: Any failed
        if: ${{ needs.build.result != 'skipped' && needs.build_agg.result != 'success' }}
        run: exit 1

      - name: All succeeded
        run: exit 0


